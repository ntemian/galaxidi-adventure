<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galaxidi Adventure — Scene Background Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0d6c8;
    font-family: 'Georgia', serif;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 2em;
    color: #f4c542;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(244,197,66,0.3);
  }
  .subtitle {
    text-align: center;
    color: #a0937d;
    margin-bottom: 30px;
    font-style: italic;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(580px, 1fr));
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #16213e;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-4px); }
  .card img {
    width: 100%;
    display: block;
    cursor: pointer;
    image-rendering: auto;
  }
  .card .info {
    padding: 12px 16px;
  }
  .card .scene-id {
    color: #f4c542;
    font-weight: bold;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .card .scene-name {
    font-size: 1.2em;
    margin: 4px 0 2px;
    color: #e8dcc8;
  }
  .card .scene-desc {
    font-size: 0.85em;
    color: #8a7f70;
    line-height: 1.4;
  }
  .card .mood {
    display: inline-block;
    background: rgba(244,197,66,0.15);
    color: #f4c542;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75em;
    margin-top: 6px;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 90vh;
    image-rendering: auto;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(244,197,66,0.2);
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 3em;
    color: #f4c542;
    cursor: pointer;
    padding: 20px;
    user-select: none;
  }
  .lightbox .nav.prev { left: 10px; }
  .lightbox .nav.next { right: 10px; }
  .lightbox .caption {
    position: absolute;
    bottom: 20px;
    text-align: center;
    width: 100%;
    color: #f4c542;
    font-size: 1.3em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .lightbox .close {
    position: absolute;
    top: 15px; right: 25px;
    font-size: 2em;
    color: #e0d6c8;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Το Μυστήριο του Γαλαξειδίου</h1>
<p class="subtitle">Scene Background Gallery — New Generation (OpenAI Anime)</p>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLB()">&times;</span>
  <span class="nav prev" onclick="navLB(-1)">&lsaquo;</span>
  <img id="lb-img" src="">
  <span class="nav next" onclick="navLB(1)">&rsaquo;</span>
  <div class="caption" id="lb-caption"></div>
</div>

<script>
const scenes = [
  {
    id: 'exterior', name: 'ΤΟ ΣΠΙΤΙ — ΓΑΛΑΞΙΔΙ',
    img: 'assets/pixel-exterior-new.png',
    desc: 'The family house in Galaxidi. Whitewashed stone, bougainvillea, harbor view.',
    mood: 'Warm & Inviting'
  },
  {
    id: 'terrace', name: 'Η ΒΕΡΑΝΤΑ',
    img: 'assets/pixel-terrace-new.png',
    desc: 'Terrace overlooking the harbor. Parnassus, rooftops, dolphins in the distance.',
    mood: 'Serene & Majestic'
  },
  {
    id: 'kitchen', name: 'ΤΟ ΓΡΑΦΕΙΟ ΤΟΥ ΚΑΠΕΤΑΝΙΟΥ',
    img: 'assets/pixel-kitchen-new.png',
    desc: 'Captain Loukas Visvikis\'s study. Ship models, charts, the locked drawer.',
    mood: 'Mysterious & Nostalgic'
  },
  {
    id: 'port', name: 'ΤΟ ΛΙΜΑΝΙ',
    img: 'assets/pixel-port-new.png',
    desc: 'Galaxidi harbor. Fishing boats, the Elpida, warehouses, cats on warm stones.',
    mood: 'Lively & Picturesque'
  },
  {
    id: 'museum', name: 'ΤΟ ΝΑΥΤΙΚΟ ΜΟΥΣΕΙΟ',
    img: 'assets/pixel-museum-new.png',
    desc: 'Maritime Museum interior. Ship models, captain portraits, nautical instruments.',
    mood: 'Scholarly & Reverent'
  },
  {
    id: 'liotrivi', name: 'ΛΙΟΤΡΙΒΙ',
    img: 'assets/pixel-liotrivi-new.png',
    desc: 'Olive press taverna. FULL of people — bouzouki, dancing, wine, mezedes. Athos is here.',
    mood: 'Festive & Joyous'
  },
  {
    id: 'cave', name: 'ΤΟ ΣΠΗΛΑΙΟ ΤΟΥ ΚΑΡΚΑΡΟΥ',
    img: 'assets/pixel-cave-new2.png',
    desc: 'The Cave of Karkaros. Turquoise light, stalactites, vote inscription, green glow.',
    mood: 'Mysterious & Awe-Inspiring'
  },
  {
    id: 'church', name: 'ΑΓΙΟΣ ΝΙΚΟΛΑΟΣ (ΕΞΩΤΕΡΙΚΟ)',
    img: 'assets/pixel-church-new.png',
    desc: 'Church of Agios Nikolaos exterior. Blue dome, fountain, bougainvillea.',
    mood: 'Sacred & Peaceful'
  },
  {
    id: 'church_interior', name: 'ΑΓΙΟΣ ΝΙΚΟΛΑΟΣ — ΕΣΩΤΕΡΙΚΟ',
    img: 'assets/pixel-church-interior-new.png',
    desc: 'Church interior. Golden iconostasis, candles, the floor tile with Λ.Β. initials.',
    mood: 'Reverent & Mystical'
  },
  {
    id: 'windmill', name: 'Ο ΜΥΛΟΣ',
    img: 'assets/pixel-windmill-new.png',
    desc: 'Hilltop windmill above Galaxidi. Telescope, wildflowers, epic panoramic sunset.',
    mood: 'Epic & Wondrous'
  },
  {
    id: 'boat', name: 'ΤΟ ΚΑΡΑΒΙ — ΕΛΠΙΔΑ',
    img: 'assets/pixel-boat-new.png',
    desc: 'The Elpida sailing ship at golden sunset. Full sails, deck view, island ahead.',
    mood: 'Romantic & Adventurous'
  },
  {
    id: 'graveyard', name: 'ΤΟ ΝΕΚΡΟΤΑΦΕΙΟ',
    img: 'assets/pixel-graveyard-new.png',
    desc: 'Cemetery by the sea at twilight. Captain Loukas Visvikis\'s grave, cypress, moonlight, angel.',
    mood: 'Haunting & Ethereal'
  },
  {
    id: 'treasure', name: 'Ο ΘΗΣΑΥΡΟΣ — ΑΓΙΟΣ ΓΕΩΡΓΙΟΣ',
    img: 'assets/pixel-treasure-new2.png',
    desc: 'Treasure island at dawn. Chapel on the hill, dig site, the Elpida anchored nearby.',
    mood: 'Exciting & Hopeful'
  },
  {
    id: 'new_era', name: 'Η ΝΕΑ ΕΠΟΧΗ',
    img: 'assets/pixel-new-era-new.png',
    desc: 'Harbor celebration at sunset. Dozens of townsfolk, bunting, the signing podium.',
    mood: 'Triumphant & Joyous'
  }
];

// Build gallery
const gallery = document.getElementById('gallery');
scenes.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${s.img}" alt="${s.name}" onclick="openLB(${i})" loading="lazy">
    <div class="info">
      <div class="scene-id">${s.id}</div>
      <div class="scene-name">${s.name}</div>
      <div class="scene-desc">${s.desc}</div>
      <span class="mood">${s.mood}</span>
    </div>
  `;
  gallery.appendChild(card);
});

// Lightbox
let lbIdx = 0;
function openLB(i) {
  lbIdx = i;
  updateLB();
  document.getElementById('lightbox').classList.add('active');
}
function closeLB() {
  document.getElementById('lightbox').classList.remove('active');
}
function navLB(dir) {
  event.stopPropagation();
  lbIdx = (lbIdx + dir + scenes.length) % scenes.length;
  updateLB();
}
function updateLB() {
  document.getElementById('lb-img').src = scenes[lbIdx].img;
  document.getElementById('lb-caption').textContent = `${scenes[lbIdx].name} — ${scenes[lbIdx].desc}`;
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLB();
});
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') navLB(-1);
  if (e.key === 'ArrowRight') navLB(1);
});
</script>
</body>
</html>
